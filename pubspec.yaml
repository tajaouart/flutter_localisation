name: flutter_localisation
description: >-
  Type-safe Flutter localization (i18n/l10n) from ARB files: code generation,
  flavors, plurals, and optional over-the-air translation updates for your app.
version: 2.7.1
homepage: https://flutterlocalisation.com
repository: https://github.com/tajaouart/flutter_localisation
issue_tracker: https://github.com/tajaouart/flutter_localisation/issues
documentation: https://flutterlocalisation.com

topics:
  - localization
  - internationalization
  - i18n
  - l10n
  - intl

screenshots:
  - description: Switching between seven languages, including right to left Arabic.
    path: screenshots/languages.gif
  - description: Typed strings with live updates marked in the example app.
    path: screenshots/home.png
  - description: Arabic plurals and right to left layout.
    path: screenshots/arabic.png
  - description: Plural categories, select and nested messages.
    path: screenshots/plurals.png
  - description: Dates, currencies, compact numbers and the live update panel.
    path: screenshots/live_updates.png

environment:
  sdk: ^3.4.1

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.0.2
  http: ^1.4.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  path: ^1.9.1
  flutter_localizations:
    sdk: flutter


dev_dependencies:
  test: ^1.16.0
  lints: ^6.0.0
  mockito: ^5.4.6
  flutter_test:
    sdk: flutter

executables:
  flutter_localisation: flutter_localisation
  generate: generate
flutter:
  generate: true